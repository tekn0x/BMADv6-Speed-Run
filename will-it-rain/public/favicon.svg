<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background matching app theme (#000000) -->
  <rect width="32" height="32" fill="#000000"/>

  <!-- Raindrop with modern gradient -->
  <defs>
    <linearGradient id="dropGradient-32" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="highlight-32" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#93C5FD;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:0" />
    </radialGradient>
  </defs>

  <g transform="translate(16, 16)">
    <!-- Main raindrop shape -->
    <path
      d="M 0,-8
         C -4.8,-8 -4.8,1.6 0,8
         C 4.8,1.6 4.8,-8 0,-8
         Z"
      fill="url(#dropGradient-32)"
      stroke="#2563EB"
      stroke-width="2"
    />

    <!-- Highlight -->
    <ellipse
      cx="-1.92"
      cy="-3.84"
      rx="1.6"
      ry="2.56"
      fill="url(#highlight-32)"
    />
  </g>
</svg>