<?xml version="1.0" encoding="UTF-8"?>
<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background matching app theme (#000000) -->
  <rect width="180" height="180" fill="#000000"/>

  <!-- Raindrop with modern gradient -->
  <defs>
    <linearGradient id="dropGradient-180" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="highlight-180" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#93C5FD;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:0" />
    </radialGradient>
  </defs>

  <g transform="translate(90, 90)">
    <!-- Main raindrop shape -->
    <path
      d="M 0,-45
         C -27,-45 -27,9 0,45
         C 27,9 27,-45 0,-45
         Z"
      fill="url(#dropGradient-180)"
      stroke="#2563EB"
      stroke-width="2"
    />

    <!-- Highlight -->
    <ellipse
      cx="-10.799999999999999"
      cy="-21.599999999999998"
      rx="9"
      ry="14.4"
      fill="url(#highlight-180)"
    />
  </g>
</svg>