<?xml version="1.0" encoding="UTF-8"?>
<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background matching app theme (#000000) -->
  <rect width="192" height="192" fill="#000000"/>

  <!-- Raindrop with modern gradient -->
  <defs>
    <linearGradient id="dropGradient-192" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="highlight-192" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#93C5FD;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:0" />
    </radialGradient>
  </defs>

  <g transform="translate(96, 96)">
    <!-- Main raindrop shape -->
    <path
      d="M 0,-48
         C -28.799999999999997,-48 -28.799999999999997,9.600000000000001 0,48
         C 28.799999999999997,9.600000000000001 28.799999999999997,-48 0,-48
         Z"
      fill="url(#dropGradient-192)"
      stroke="#2563EB"
      stroke-width="2"
    />

    <!-- Highlight -->
    <ellipse
      cx="-11.52"
      cy="-23.04"
      rx="9.600000000000001"
      ry="15.36"
      fill="url(#highlight-192)"
    />
  </g>
