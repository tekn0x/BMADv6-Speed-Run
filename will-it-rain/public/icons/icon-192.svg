<?xml version="1.0" encoding="UTF-8"?>
<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background matching theme -->
  <rect width="192" height="192" fill="#0a0a0a"/>

  <!-- Simple umbrella icon in light gray -->
  <g transform="translate(96, 96)">
    <!-- Umbrella arc -->
    <path d="M -64 0 Q -64 -64 0 -64 Q 64 -64 64 0"
          fill="none"
          stroke="#e5e5e5"
          stroke-width="6.4"
          stroke-linecap="round"/>

    <!-- Handle -->
    <path d="M 0 -16 L 0 48 Q 24 64 32 48"
          fill="none"
          stroke="#e5e5e5"
          stroke-width="6.4"
          stroke-linecap="round"/>

    <!-- Rain drops -->
    <circle cx="-32" cy="24" r="4.8" fill="#a1a1aa"/>
    <circle cx="0" cy="32" r="4.8" fill="#a1a1aa"/>
    <circle cx="32" cy="24" r="4.8" fill="#a1a1aa"/>
  </g>
</svg>