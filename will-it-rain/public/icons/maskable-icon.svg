<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background matching app theme (#000000) -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Raindrop with modern gradient - scaled for safe zone -->
  <defs>
    <linearGradient id="dropGradient-maskable-512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="highlight-maskable-512" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#93C5FD;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:0" />
    </radialGradient>
  </defs>

  <g transform="translate(256, 256)">
    <!-- Main raindrop shape - scaled to fit safe zone -->
    <path
      d="M 0,-102.4
         C -61.44,-102.4 -61.44,20.480000000000004 0,102.4
         C 61.44,20.480000000000004 61.44,-102.4 0,-102.4
         Z"
      fill="url(#dropGradient-maskable-512)"
      stroke="#2563EB"
      stroke-width="5.12"
    />

    <!-- Highlight -->
    <ellipse
      cx="-24.576"
      cy="-49.152"
      rx="20.480000000000004"
      ry="32.768"
      fill="url(#highlight-maskable-512)"
    />
  </g>
</svg>