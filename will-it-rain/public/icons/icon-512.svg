<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background matching app theme (#000000) -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Raindrop with modern gradient -->
  <defs>
    <linearGradient id="dropGradient-512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="highlight-512" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#93C5FD;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:0" />
    </radialGradient>
  </defs>

  <g transform="translate(256, 256)">
    <!-- Main raindrop shape -->
    <path
      d="M 0,-128
         C -76.8,-128 -76.8,25.6 0,128
         C 76.8,25.6 76.8,-128 0,-128
         Z"
      fill="url(#dropGradient-512)"
      stroke="#2563EB"
      stroke-width="5.12"
    />

    <!-- Highlight -->
    <ellipse
      cx="-30.72"
      cy="-61.44"
      rx="25.6"
      ry="40.96"
      fill="url(#highlight-512)"
    />
  </g>
</svg>